.ax{--bg:#FAFAFA;--fg:#0A0A0A;--card:#FFFFFF;--muted:#F3F3F3;--mfg:#6E6E6E;--border:#E4E4E4;--primary:#6213FF;--primary-8:rgba(98,19,255,.08);--primary-15:rgba(98,19,255,.15);--accent:#F1ECFF;--danger:#E8215F;--danger-10:rgba(232,33,95,.10);--success:#00B85A;--success-10:rgba(0,184,90,.10);--warning:#B97A12;--warning-12:rgba(185,122,18,.12);--sb:#111111;--sbfg:#F3F3F3;--sbacc:#262626;--sbborder:#2E2E2E;--sbprim:#8A4DFF;

/* barre latérale */

.ax .logo{display:flex;align-items:center;gap:10px;padding:4px 6px}

/* zone principale */
.ax .ins{flex:1;display:flex;flex-direction:column;min-width:0}

.ax .p-av{background:#F1F5F9;color:#334155}.ax .p-af{background:#EDE9FE;color:#5B21B6}.ax .p-fa{background:#DBEAFE;color:#1E40AF}.ax .p-re{background:#D1FAE5;color:#065F46}

<style>
/* ===== Parcours animé ===== */
html,body{margin:0;height:100%;overflow:hidden;background:#111}
body{font-family:"Poppins",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#FAFAFA}
#app{position:absolute;inset:0;transition:opacity .35s ease}
#app.fade{opacity:0}
/* l'application occupe tout l'écran */
#app>.ax{width:100%;height:100%;overflow:hidden}
#app>.ax .sb{min-height:0;height:100%}
#app>.ax .ins{height:100%;overflow:hidden}
#app>.ax main{overflow:hidden;min-height:0;padding-bottom:280px}
#app>.ax.solo{overflow:hidden}
/* les liserés « Nouveau » des maquettes sont retirés pour la vidéo */
.ax .new{outline:none!important}
.ax .newtag{display:none!important}
/* apparitions */
.hid{opacity:0!important;transform:translateY(8px)}
.rv{transition:opacity .45s ease,transform .45s ease,background-color .6s ease}
.slide-in{animation:slideIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translate(-46px,-10px) rotate(-2deg)}to{opacity:1;transform:none}}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%{background-color:rgba(0,184,90,.28)}100%{background-color:transparent}}
.pflash{animation:pflash 1.8s ease}
@keyframes pflash{0%{background-color:rgba(98,19,255,.22)}100%{background-color:transparent}}
.ax .field.okrow{background:var(--success-10);border-radius:6px;margin:0 -8px;padding-left:8px;padding-right:8px;transition:background-color .6s ease}
.ax .field .vok{color:#008A43;font-weight:600}
.ax .srcf.ok{color:#008A43}
.ax .bt.done{background:var(--success);box-shadow:0 1px 3px rgba(0,184,90,.35);color:#fff}
.caret{display:inline-block;width:2px;height:1.05em;background:currentColor;margin-left:1px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ax .compose .typed{color:var(--fg)}
.spin{display:inline-block;width:9px;height:9px;border:1.5px solid #CDBDFF;border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin-right:5px;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.collapse{transition:opacity .5s ease,max-height .7s ease,margin .7s ease,padding .7s ease;overflow:hidden}

function scrollTo(target,ms=700){
  const sc=scroller(), from=sc.scrollTop, max=sc.scrollHeight-sc.clientHeight;
  const to=Math.max(0,Math.min(max,target)); if(Math.abs(to-from)<2)return Promise.resolve();
  const id=RUN;
  return new Promise(res=>{const t0=performance.now();
    const f=(t)=>{if(id!==RUN)return res();const k=Math.min(1,(t-t0)/ms);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;sc.scrollTop=from+(to-from)*e;k<1?requestAnimationFrame(f):res();};
    requestAnimationFrame(f);});
}
// garde un élément (ou un intervalle) dans la zone lisible, au-dessus de la légende
async function ensureVisible(topEl,botEl=topEl,ms=700){

  const minTop=sr.top+60*SC, maxBot=st.bottom-200*SC;
  let d=0;
  if(bot>maxBot) d=(bot-maxBot)/SC;
  if(top-d*SC<minTop) d=(top-minTop)/SC;
  if(Math.abs(d)>1) await scrollTo(sc.scrollTop+d,ms);
}

// ===== Navigation =====
let idx=-1, auto=false, autoT0=0;
window.__chapters=[]; window.__done=false;
async function play(i){
  if(i<0||i>=STEPS.length)return;
  RUN++; idx=i;
  ver.hidden=true;
  $('#ctl>span').hidden=i!==0;
  $$('.ovl').forEach(o=>o.remove());
  if(i!==0&&i!==STEPS.length-1&&STEPS[i].name.indexOf('Fin de mission')<0) hideCard();
  if(auto) window.__chapters.push({i,name:STEPS[i].name,t:(performance.now()-autoT0)/1000});
  try{
    await STEPS[i].run();
    if(auto){ if(i+1<STEPS.length) play(i+1); else {auto=false;window.__done=true;document.body.classList.remove('auto');} }
  }catch(e){ if(!(e instanceof Cancel)) console.error(e); }
}
function startAuto(){auto=true;document.body.classList.add('auto');window.__chapters=[];window.__done=false;autoT0=performance.now();play(0);}
window.__startAuto=startAuto; window.__play=play;
const stopAuto=()=>{auto=false;document.body.classList.remove('auto');};
$('#next').addEventListener('click',()=>{stopAuto();play(Math.min(idx+1,STEPS.length-1));});
$('#prev').addEventListener('click',()=>{stopAuto();play(Math.max(idx-1,0));});
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stopAuto();play(Math.min(idx+1,STEPS.length-1));}
  else if(e.key==='ArrowLeft'){stopAuto();play(Math.max(idx-1,0));}
  else if(e.key==='a'||e.key==='A'){startAuto();}
});
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{ if(!/[?&]noinit/.test(location.search)) play(0); });

</script>
