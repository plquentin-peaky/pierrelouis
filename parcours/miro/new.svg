<rect id="lg2" x="3280" y="44" width="260" height="64" rx="12" fill="#f8d3af" stroke="none" data-content="À créer" data-text-color="#9b4a08" data-font-family="noto_sans" data-font-size="22" data-font-weight="bold" />
<textArea id="h0" x="300" y="168" width="700" font-family="noto_sans" font-size="30" font-weight="bold" fill="#1a1a1a">1 · Ouverture du chantier</textArea>
<textArea id="h1" x="1060" y="168" width="360" font-family="noto_sans" font-size="30" font-weight="bold" fill="#1a1a1a">2 · Date de l'échéance</textArea>
<textArea id="h2" x="1420" y="168" width="700" font-family="noto_sans" font-size="30" font-weight="bold" fill="#1a1a1a">3 · Émission et suivi</textArea>
<textArea id="h3" x="2500" y="168" width="360" font-family="noto_sans" font-size="30" font-weight="bold" fill="#1a1a1a">4 · Fin prévue au devis</textArea>
<textArea id="h4" x="3240" y="168" width="360" font-family="noto_sans" font-size="30" font-weight="bold" fill="#1a1a1a">5 · Chaque mois</textArea>
<rect id="lcp" x="32" y="230" width="220" height="260" rx="12" fill="#dedaff" stroke="none" data-content="Chef de projet&lt;br /&gt;(ou associé de référence)" data-text-color="#6631d7" data-font-family="noto_sans" data-font-size="21" data-font-weight="bold" />
