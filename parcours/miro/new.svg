<rect id="lco" x="32" y="1350" width="220" height="260" rx="12" fill="#dedaff" stroke="none" data-content="Comptable et&lt;br /&gt;plateforme agréée" data-text-color="#6631d7" data-font-family="noto_sans" data-font-size="21" data-font-weight="bold" />
<rect id="lcob" x="264" y="1350" width="3304" height="260" fill="#f4f2fd" stroke="none" />
<rect id="a1" x="300" y="280" width="300" height="160" rx="12" fill="#f8d3af" stroke="none" data-content="Dépose le devis signé et le bon de commande" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="a2" x="300" y="560" width="300" height="160" rx="12" fill="#f8d3af" stroke="none" data-content="Lit le devis : propose l'échéancier écrit au devis et les informations, avec leur source. Ne garde pas le document" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" />
<rect id="a3" x="680" y="280" width="300" height="160" rx="12" fill="#fff6b6" stroke="none" data-content="Relit l'échéancier, puis les informations ; valide en un clic" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="a4" x="680" y="840" width="300" height="160" rx="12" fill="#fff6b6" stroke="none" data-content="Ou le fait à la place du chef de projet, et complète ce qui manque" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="b1" x="1060" y="560" width="300" height="160" rx="12" fill="#adf0c7" stroke="none" data-content="À la date prévue, prépare la facture en brouillon" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="b2" x="1420" y="280" width="300" height="160" rx="12" fill="#f8d3af" stroke="none" data-content="Vérifie la facture depuis l'échéancier : c'est bon, ou à corriger" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="c1" x="1420" y="840" width="300" height="160" rx="12" fill="#adf0c7" stroke="none" data-content="Émet : numéro définitif, PDF Plein Sens Ethique" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="c2" x="1780" y="840" width="300" height="160" rx="12" fill="#fff6b6" stroke="none" data-content="Envoie par mail ou dépose sur le portail du client, puis note le statut" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" />
<rect id="c3" x="1780" y="1120" width="300" height="160" rx="12" fill="#adf0c7" stroke="none" data-content="Reçoit la facture et la paie" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="c4" x="1780" y="560" width="300" height="160" rx="12" fill="#fff6b6" stroke="none" data-content="Calcule le retard, signale ce qui manque, prépare le texte de relance" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="c5" x="2140" y="840" width="300" height="160" rx="12" fill="#fff6b6" stroke="none" data-content="Note le paiement ; relance depuis sa messagerie si besoin" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="d1" x="2500" y="560" width="300" height="160" rx="12" fill="#f8d3af" stroke="none" data-content="Mail au chef de projet, référent facturation en copie : le lien ouvre Alphonse" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" />
<rect id="d2" x="2860" y="280" width="300" height="160" rx="12" fill="#f8d3af" stroke="none" data-content="Dans Alphonse : facturer le solde, reporter à une date ou prévoir un complément" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" />
<rect id="d3" x="2860" y="560" width="300" height="160" rx="12" fill="#adf0c7" stroke="none" data-content="Prépare la facture de solde : même circuit que l'acompte" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="e1" x="3240" y="840" width="300" height="160" rx="12" fill="#fff6b6" stroke="none" data-content="Vérifie, puis clôt le mois : les chiffres sont figés" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="e2" x="3240" y="1400" width="300" height="160" rx="12" fill="#fff6b6" stroke="none" data-content="Le comptable reçoit trois fichiers" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="20" />
<rect id="f1" x="1060" y="1400" width="300" height="160" rx="12" fill="#f8d3af" stroke="none" data-content="Dès septembre 2027 : la plateforme agréée transmet la facture et ses statuts" data-text-color="#1a1a1a" data-font-family="noto_sans" data-font-size="18" />
<textArea id="ft" x="34" y="1640" width="3500" font-family="noto_sans" font-size="22" fill="#333333"><b>À retenir.</b> Toute l'équipe voit la facturation de tous les chantiers, en lecture ; seuls le chef de projet, l'associé de référence et le rôle Finance agissent. Alphonse n'envoie pas les factures : la finance les envoie ou les dépose comme aujourd'hui, puis note le statut. Un lien dans un mail ouvre Alphonse : la décision se prend dans Alphonse, jamais d'un simple clic dans le mail. Le référent facturation de chaque enquête est une personne du rôle Finance, qui peut changer d'une enquête à l'autre.</textArea>
