<textArea id="tt" x="32" y="30" width="2500" font-family="noto_sans" font-size="56" font-weight="bold" fill="#1a1a1a">Facturer une enquête Plein Sens Ethique dans Alphonse : le parcours cible</textArea>
<textArea id="st" x="34" y="112" width="2500" font-family="noto_sans" font-size="24" fill="#555555">Mis à jour le 10 novembre 2026, après les retours du 9 novembre. Remplace le parcours du cadre 1.</textArea>
<rect id="lg0" x="2700" y="44" width="260" height="64" rx="12" fill="#adf0c7" stroke="none" data-content="Existe déjà" data-text-color="#067429" data-font-family="noto_sans" data-font-size="22" data-font-weight="bold" />
