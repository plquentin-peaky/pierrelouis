<rect id="lfib" x="264" y="790" width="3304" height="260" fill="#f4f2fd" stroke="none" />
<rect id="lcl" x="32" y="1070" width="220" height="260" rx="12" fill="#dedaff" stroke="none" data-content="Client" data-text-color="#6631d7" data-font-family="noto_sans" data-font-size="21" data-font-weight="bold" />
