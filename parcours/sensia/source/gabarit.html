<style>
/* ===== Scène ===== */
html,body{margin:0;height:100%;overflow:hidden;background:#0E0F1F}
body{font-family:"Poppins",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 700px at 50% -10%,#23264A 0%,#141530 55%,#0E0F1F 100%)}
#top{position:absolute;left:40px;right:40px;top:22px;height:52px;display:flex;align-items:center;justify-content:space-between;transition:opacity .4s ease}
#who{display:flex;align-items:center;gap:14px;color:#fff}
#who .avx{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 16px "Poppins";background:#8A4DFF;color:#fff}
#who .n{font:700 30px/1 "Barlow Condensed",sans-serif;letter-spacing:.01em}
#who .r{font:400 16px/1.2 "Poppins";color:rgba(255,255,255,.7)}
#who .cas{font:600 13px "Poppins";letter-spacing:.14em;text-transform:uppercase;color:#CDBDFF;border:1px solid rgba(205,189,255,.4);border-radius:999px;padding:6px 12px;margin-right:6px}
#tag{font:500 14px "Poppins";color:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 14px}

/* fenêtres */
.win{position:absolute;top:92px;height:828px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 30px 70px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.08);transition:left .9s cubic-bezier(.5,.05,.2,1),width .9s cubic-bezier(.5,.05,.2,1),box-shadow .5s ease,opacity .5s ease}
.win.act{box-shadow:0 30px 70px -30px rgba(0,0,0,.75),0 0 0 3px rgba(138,77,255,.85)}
.win.dim{opacity:.86}
.win .chrome{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#ECECF1;border-bottom:1px solid #DCDCE3}
.win .chrome i{width:11px;height:11px;border-radius:50%;background:#D5D5DC;flex:none}
.win .chrome .url{margin-left:10px;height:26px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:7px;background:#fff;border:1px solid #DCDCE3;font:500 13px "Inter","Poppins",sans-serif;color:#51525C;white-space:nowrap}
.win .chrome .url svg{width:12px;height:12px;stroke:#8A8B96;fill:none;stroke-width:2}
.win .chrome .lab{margin-left:auto;font:700 17px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#2B2C3A;white-space:nowrap}
.win .chrome .lab small{font:500 12px "Poppins";letter-spacing:0;text-transform:none;color:#7A7B88;margin-left:8px}
.win .vp{position:absolute;left:0;right:0;top:44px;bottom:0;overflow:hidden;background:#fff}
.win .inner{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .9s cubic-bezier(.5,.05,.2,1),height .9s cubic-bezier(.5,.05,.2,1)}

/* connecteur MCP */
#mcp{position:absolute;top:92px;height:828px;width:96px;transition:left .9s cubic-bezier(.5,.05,.2,1),opacity .5s ease;z-index:6}
#mcp .wire{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:repeating-linear-gradient(90deg,rgba(205,189,255,.55) 0 10px,transparent 10px 20px);background-size:20px 4px;opacity:.5}
#mcp.r .wire{animation:wireR .5s linear infinite;opacity:1}
#mcp.l .wire{animation:wireL .5s linear infinite;opacity:1}
@keyframes wireR{to{background-position:20px 0}}
@keyframes wireL{to{background-position:-20px 0}}
#mcp .pill{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:22px;background:#1D1E3D;border:2px solid rgba(205,189,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;transition:transform .3s ease,background .3s ease,box-shadow .3s ease}
#mcp .pill svg{width:22px;height:22px;stroke:#CDBDFF;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mcp .pill b{font:700 17px/1 "Barlow Condensed",sans-serif;letter-spacing:.12em}
#mcp.r .pill,#mcp.l .pill{background:#6213FF;transform:scale(1.1);box-shadow:0 0 0 8px rgba(138,77,255,.22),0 0 40px rgba(138,77,255,.7)}
#mcp.r .pill svg,#mcp.l .pill svg{stroke:#fff}
#mcp .sub{position:absolute;left:50%;top:calc(50% + 50px);transform:translateX(-50%);font:500 12px "Poppins";color:rgba(255,255,255,.6);white-space:nowrap}
#mcp .dir{position:absolute;left:50%;top:calc(50% - 118px);transform:translateX(-50%);white-space:nowrap;font:600 13.5px/1.2 "Poppins";color:#fff;background:#6213FF;border-radius:12px;padding:7px 9px;flex-direction:column;text-align:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.6);opacity:0;transition:opacity .3s ease;display:flex;align-items:center;gap:2px}
#mcp .dir.on{opacity:1}
#mcp .dir small{font:400 12px "Poppins";opacity:.85}

/* légende */
#cap{position:absolute;left:0;right:0;top:944px;height:96px;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#cap.off{opacity:0}
#cap span{font:500 25px/1.3 "Poppins",sans-serif;color:#fff;text-align:center;max-width:1500px}
#cap b{color:#CDBDFF;font-weight:600}

/* curseur */
#cur{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#2B2B2B;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45);z-index:40;pointer-events:none;transition:transform .7s cubic-bezier(.45,.05,.25,1),opacity .3s ease;opacity:0}
#cur.on{opacity:1}
.halo{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid rgba(98,19,255,.6);background:rgba(98,19,255,.15);z-index:39;pointer-events:none;animation:halo .65s ease-out forwards}
@keyframes halo{from{transform:scale(1);opacity:1}to{transform:scale(3.6);opacity:0}}

/* données en transit */
.chip{position:absolute;left:0;top:0;z-index:30;pointer-events:none;white-space:nowrap;font:600 14px "Poppins";color:#fff;background:#6213FF;border:2px solid #fff;border-radius:999px;padding:5px 12px;box-shadow:0 8px 20px -6px rgba(0,0,0,.55);will-change:transform,opacity}
.chip.read{background:#0F766E}

/* cartons */
#card{position:absolute;inset:0;z-index:50;background:radial-gradient(1100px 700px at 50% 0%,#262A55 0%,#14152E 60%,#0C0D1C 100%);color:#F3F3F3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;transition:opacity .6s ease}
#card.off{opacity:0;pointer-events:none}
#card .k{font:600 16px "Poppins",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#CDBDFF}
#card .t{font:700 74px/1.04 "Barlow Condensed",sans-serif;max-width:1400px}
#card .bar{width:72px;height:5px;border-radius:9px;background:#8A4DFF}
#card .s{font:400 27px/1.4 "Poppins",sans-serif;color:rgba(243,243,243,.82);max-width:1150px}
#card .foot{position:absolute;bottom:54px;left:0;right:0;font:500 15px "Poppins";color:rgba(243,243,243,.5)}
#card .pav{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font:600 42px "Poppins";background:linear-gradient(135deg,#6213FF,#B08CFF);color:#fff;box-shadow:0 0 0 8px rgba(138,77,255,.18)}
#card .rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
#card .rv.in{opacity:1;transform:none}
/* schéma du principe */
.prin{display:flex;align-items:stretch;justify-content:center;gap:0;margin-top:18px}
.prin .bx{width:450px;border-radius:20px;padding:26px 26px 24px;text-align:left;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16)}
.prin .bx .h{font:700 38px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;display:flex;align-items:center;gap:12px}
.prin .bx .h i{width:14px;height:14px;border-radius:50%;flex:none}
.prin .bx .d{font:400 19px/1.4 "Poppins";color:rgba(243,243,243,.8);margin-top:12px}
.prin .bx .l{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.prin .bx .l span{font:500 14px "Poppins";padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.88)}
.prin .lk{width:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.prin .lk .pl{width:92px;height:92px;border-radius:26px;background:#6213FF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 0 0 10px rgba(138,77,255,.2),0 0 50px rgba(138,77,255,.6)}
.prin .lk .pl svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prin .lk .pl b{font:700 20px/1 "Barlow Condensed";letter-spacing:.12em}
.prin .lk .ar{font:500 15px "Poppins";color:rgba(255,255,255,.75)}
.lockl{display:inline-flex;align-items:center;gap:12px;font:500 22px "Poppins";color:#fff;background:rgba(138,77,255,.22);border:1.5px solid rgba(205,189,255,.5);border-radius:14px;padding:14px 22px;margin-top:14px}
.lockl svg{width:22px;height:22px;stroke:#CDBDFF;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.keep{display:flex;flex-direction:column;gap:16px;margin-top:8px;text-align:left}
.keep div{display:flex;align-items:center;gap:18px;font:500 29px/1.3 "Poppins";color:#fff}
.keep div i{flex:none;width:46px;height:46px;border-radius:50%;background:#6213FF;display:grid;place-items:center;font:700 22px "Barlow Condensed";font-style:normal}

/* ===== Reproduction Sens IA (tokens relevés dans src/index.css) ===== */
.sia{--bg:hsl(240 10% 98%);--fg:hsl(240 10% 4%);--card:hsl(240 10% 99%);--primary:hsl(243 75% 59%);--p10:hsl(243 75% 59% / .1);--muted:hsl(240 5% 96%);--mfg:hsl(240 4% 46%);--border:hsl(240 6% 90%);
  width:1160px;height:100%;display:flex;background:var(--bg);color:var(--fg);font:14px/1.5 "Inter",system-ui,sans-serif;text-align:left}
.sia svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sia svg.i.s4{width:16px;height:16px}.sia svg.i.s3{width:14px;height:14px}.sia svg.i.s2{width:12px;height:12px}
.sia .rail{width:60px;flex:none;background:hsl(240 5% 96%);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px}
.sia .rail .lg{width:34px;height:34px;border-radius:9px;background:#111;color:#fff;display:grid;place-items:center;font:700 12px "Poppins";margin-bottom:8px}
.sia .rail .ri{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;color:var(--fg)}
.sia .rail .ri.on{background:var(--p10);color:var(--primary)}
.sia .rail .me{margin-top:auto;width:40px;height:40px;border-radius:50%;background:var(--p10);color:var(--primary);display:grid;place-items:center;font-weight:600;font-size:14px}
.sia .convs{width:264px;flex:none;border-right:1px solid var(--border);background:hsl(240 5% 96% / .3);display:flex;flex-direction:column}
.sia .convs .hd{padding:16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.sia .mode{display:flex;gap:4px;padding:4px;border-radius:6px;background:hsl(240 5% 96% / .6);border:1px solid hsl(240 6% 90% / .6)}
.sia .mode span{flex:1;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500;color:var(--mfg)}
.sia .mode span.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px hsl(243 75% 59% / .3)}
.sia .mode span.on svg{color:var(--primary)}
.sia .newr{display:flex;gap:8px;align-items:center}
.sia .ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:6px;flex:none}
.sia .obtn{flex:1;height:36px;border:1px solid var(--border);border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500}
.sia .gbtn{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mfg);font-size:14px;font-weight:500}
.sia .sinp{height:36px;border:1px solid var(--border);border-radius:6px;background:var(--bg);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mfg);font-size:14px}
.sia .flt{display:flex;gap:4px;border-radius:8px;background:hsl(240 5% 96% / .6);padding:2px}
.sia .flt span{flex:1;height:28px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:500;color:var(--mfg)}
.sia .flt span.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sia .cl{padding:8px;display:flex;flex-direction:column;gap:4px}
.sia .cl div{padding:12px;border-radius:8px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sia .cl div.on{background:var(--p10);color:var(--primary)}
.sia .chat{flex:1;min-width:0;display:flex;flex-direction:column;background:hsl(240 5% 96% / .3)}
.sia .msgs{flex:1;min-height:0;overflow:hidden;padding:24px 40px 8px}
.sia .mw{max-width:896px;margin:0 auto}
.sia .hello{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.sia .hello h2{font-size:46px;font-weight:300;letter-spacing:-.02em;margin:0;color:hsl(240 10% 4% / .9)}
.sia .u{display:flex;justify-content:flex-end;margin-bottom:16px}
.sia .u p{max-width:80%;margin:0;background:var(--primary);color:hsl(240 10% 99%);border-radius:16px 16px 4px 16px;padding:12px 16px;font-size:15px;white-space:pre-wrap}
.sia .a{margin-bottom:24px;font-size:15px;line-height:1.6}
.sia .a p{margin:6px 0}
.sia .tg{margin:8px 0}
.sia .tg .sum{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mfg)}
.sia .tg .lst{margin:6px 0 0 6px;padding-left:12px;border-left:1px solid hsl(240 6% 90% / .9)}
.sia .tl{padding:4px 0}
.sia .tl .r1{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mfg);font-weight:500}
.sia .tl .r1 small{font-size:12px;font-weight:400;opacity:.6}
.sia .tl .r1 em{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--primary);background:var(--p10);border-radius:4px;padding:1px 6px}
.sia .tl .r2{margin:2px 0 0 22px;font-size:13.5px;color:hsl(240 5% 34%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sia .tl .ok{font-size:12px;color:hsl(240 4% 46% / .7);display:flex;align-items:center;gap:6px;padding-top:6px}
.sia .sp{width:14px;height:14px;border:2px solid hsl(243 75% 59% / .25);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.sia .kd{border:1px solid var(--border);border-radius:16px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden;margin:10px 0}
.sia .kd .kh{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);background:hsl(240 5% 96% / .4)}
.sia .kd .kh .ic{width:28px;height:28px;border-radius:50%;background:var(--p10);color:var(--primary);display:grid;place-items:center;flex:none}
.sia .kd .kh b{font-size:14px;font-weight:600;line-height:1.2;display:block}
.sia .kd .kh small{font-size:12px;color:var(--mfg);display:block;line-height:1.2}
.sia .kd .kb{padding:14px 20px}
.sia .kd .kf{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--border);background:hsl(240 5% 96% / .3);font-size:12px;color:var(--mfg)}
.sia .btn{height:36px;padding:0 14px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap}
.sia .btn.p{background:var(--primary);color:#fff}
.sia .btn.o{border:1px solid var(--border);background:var(--bg)}
.sia .btn.g{color:var(--mfg)}
.sia .btn.done{background:#059669}
.sia table.pt{width:100%;border-collapse:collapse;font-size:13.5px}
.sia table.pt th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mfg);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.sia table.pt td{padding:8px;border-bottom:1px solid hsl(240 6% 90% / .6);vertical-align:top}
.sia table.pt tr:last-child td{border-bottom:none}
.sia table.pt td.c{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.sia table.pt th.c{text-align:center}
.sia table.pt .sub{font-size:12px;color:var(--mfg);font-weight:400}
.sia .srcc{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:hsl(243 60% 45%);background:var(--p10);border-radius:999px;padding:1px 8px;white-space:nowrap}
.sia .warnc{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#B45309;background:#FEF3C7;border-radius:999px;padding:1px 8px}
.sia .opt{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--bg);margin-top:6px}
.sia .opt.on{border-color:hsl(243 75% 59% / .6);background:hsl(243 75% 59% / .05);box-shadow:0 0 0 1px hsl(243 75% 59% / .2)}
.sia .opt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--primary);margin-top:2px;flex:none;display:grid;place-items:center}
.sia .opt.on .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.sia .opt b{font-size:14px;font-weight:500;display:block;line-height:1.25}
.sia .opt small{font-size:12px;color:var(--mfg)}
.sia .opt.dash{border-style:dashed}
.sia .prog{height:4px;background:var(--muted)}.sia .prog i{display:block;height:100%;background:var(--primary)}
.sia .bdgq{font-size:12px;font-weight:600;background:var(--muted);border-radius:999px;padding:2px 10px;margin-right:8px}
.sia .comp{padding:8px 40px 18px}
.sia .cbox{max-width:896px;margin:0 auto;background:var(--bg);border:1px solid hsl(240 6% 90% / .9);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:6px}
.sia .cbox .ta{min-height:64px;padding:12px 16px;font-size:14.5px;color:var(--mfg);white-space:pre-wrap}
.sia .cbox .ta.t{color:var(--fg)}
.sia .cbox .bar{height:44px;display:flex;align-items:center;gap:4px;padding:0 6px}
.sia .cbox .bi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.sia .cbox .sel{height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px;font-weight:500}
.sia .cbox .sel .lg2{width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,hsl(243 75% 59%),hsl(258 90% 66%))}
.sia .cbox .snd{margin-left:auto;width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center}
.sia .cbox .snd.dis svg{opacity:.3}
.caret{display:inline-block;width:2px;height:1.05em;background:currentColor;margin-left:1px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sia .inv{border:1px solid var(--border);border-radius:10px;background:#fff;padding:14px 16px;font-size:13.5px}
.sia .inv .ir{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px dashed hsl(240 6% 90%)}
.sia .inv .ir:last-child{border-bottom:none}
.sia .inv .ir span{color:var(--mfg)}
.sia .inv .ir b{font-weight:600;text-align:right}
.sia .okl{display:flex;align-items:center;gap:8px;font-size:13px;color:#047857;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:8px;padding:8px 12px;margin-top:10px}
.pin{animation:pin .45s ease both}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.flashp{animation:flashp 1.8s ease}
@keyframes flashp{0%{background-color:rgba(98,19,255,.25)}100%{background-color:transparent}}
.flashg{animation:flashg 2s ease}
@keyframes flashg{0%{background-color:rgba(0,184,90,.3)}100%{background-color:transparent}}

.sia .notyet.yes{color:#065F46;background:#D1FAE5;border-color:#6EE7B7}
.sia .notyet{margin-left:auto;font-size:12.5px;font-weight:600;color:#92400E;background:#FEF3C7;border:1px solid #FCD34D;border-radius:999px;padding:3px 11px;white-space:nowrap}
.sia table.pt td.fer{vertical-align:middle;font-weight:500;font-size:12px;color:var(--mfg);background:repeating-linear-gradient(135deg,hsl(240 5% 96%) 0 6px,hsl(240 5% 93%) 6px 12px)}
.win .ax .rnote{font-size:12.5px!important;color:#3B3B3B!important}
body.fast *{transition:none!important}
/* ===== Alphonse dans la fenêtre ===== */
.win .ax{width:1280px;height:100%;overflow:hidden}
.win .ax .sb{min-height:0;height:100%}
.win .ax .ins{height:100%;overflow:hidden}
.win .ax main{overflow:hidden;min-height:0;padding-bottom:120px}
.ax .new{outline:none!important}.ax .newtag{display:none!important}
/* feuille de temps (structure relevée dans src/pages/CRA.tsx) */
.ax .eyb{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--mfg);margin-bottom:4px}
.ax .cband{border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.ax .cband .r1{display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.ax .cband .mn{display:flex;align-items:center;gap:10px;font:600 18px "Barlow Condensed",sans-serif;text-transform:capitalize}
.ax .cband .r2{border-top:1px solid var(--border);background:linear-gradient(180deg,#fff,#FAFAFA);padding:7px 16px;display:flex;align-items:center;gap:12px;font-size:12px}
.ax .cband .pg{flex:1;height:6px;border-radius:9px;background:var(--muted);overflow:hidden}
.ax .cband .pg i{display:block;height:100%;background:var(--primary);border-radius:9px;transition:width 1.4s ease,background .6s ease}
.ax .cgrid{border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ax table.cra{border-collapse:collapse;table-layout:fixed;width:100%;font-size:13px}
.ax table.cra th{font-size:12px;text-transform:uppercase;color:var(--mfg);font-weight:500;padding:8px 4px;text-align:center;vertical-align:bottom;border-bottom:1px solid var(--border)}
.ax table.cra th.l{text-align:left;padding:12px}
.ax table.cra th.s{text-align:right;font-size:10px;text-transform:none;padding:12px 8px;line-height:1.25}
.ax table.cra th .dn{font-weight:600;color:rgba(10,10,10,.7)}
.ax table.cra th .dl{font-size:9px;text-transform:none}
.ax table.cra th.am{background:rgba(245,158,11,.06)}.ax table.cra th.am .dn{color:#B45309}
.ax table.cra th.td{border-left:2px solid var(--primary);border-right:2px solid var(--primary);border-top:2px solid var(--primary);background:var(--primary-8)}
.ax table.cra th.td .dn{color:var(--primary);font-weight:700}
.ax table.cra td{padding:4px 3px;text-align:center;border-bottom:1px solid #F0F0F0}
.ax table.cra td.l{text-align:left;padding:6px 12px}
.ax table.cra td.l b{font-weight:500;font-size:13px;display:block;line-height:1.25}
.ax table.cra td.l small{font-size:11px;color:var(--mfg)}
.ax table.cra td.s{text-align:right;padding:4px 8px;font-variant-numeric:tabular-nums;color:var(--mfg)}
.ax table.cra td.s.re{color:var(--fg);font-weight:600;border-right:1px solid var(--border)}
.ax table.cra th.s.re{border-right:1px solid var(--border)}
.ax table.cra tr.sec td{background:var(--muted);text-align:left;padding:5px 16px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--mfg)}
.ax table.cra tr.tot td{border-top:1px solid var(--border);border-bottom:none;padding:8px 3px;font-size:12px;font-variant-numeric:tabular-nums}
.ax table.cra tr.tot td.l{text-transform:uppercase;color:var(--mfg);padding:8px 16px}
.ax table.cra td.td{border-left:2px solid var(--primary);border-right:2px solid var(--primary)}
.ax table.cra tr.tot td.td{border-bottom:2px solid var(--primary)}
.ax .cc{display:grid;place-items:center;width:38px;height:30px;margin:0 auto;border-radius:6px;border:1px dashed var(--border);font-size:12.5px;color:rgba(110,110,110,.4);font-variant-numeric:tabular-nums;transition:background .35s ease,color .35s ease,border-color .35s ease,transform .35s ease}
.ax .cc.h{border:1px solid rgba(98,19,255,.3);background:rgba(98,19,255,.12);color:var(--primary);font-weight:600}
.ax .cc.f{border:1px solid var(--primary);background:linear-gradient(135deg,#6213FF,#8A4DFF);color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(98,19,255,.3)}
.ax .cc.sat{border-color:rgba(245,158,11,.3)}
.ax .cc.off{border:none;background:#F5F5F5;color:#BDBDBD}
.ax .cc.off svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.ax .cc.pop{transform:scale(1.22)}
.ax .tok{color:#008A43;font-weight:600}
.atoast{position:absolute;right:14px;top:50px;padding:9px 16px!important;z-index:8;display:flex;align-items:center;gap:10px;background:#111;color:#fff;border-radius:10px;padding:13px 18px;font:500 15px "Poppins";box-shadow:0 14px 34px -12px rgba(0,0,0,.6);opacity:0;transform:translateY(-12px);transition:opacity .4s ease,transform .4s ease}
.atoast.on{opacity:1;transform:none}
.atoast svg{width:18px;height:18px;stroke:#34D399;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.atoast small{font-weight:400;color:rgba(255,255,255,.7)}
.viasia{display:inline-flex;align-items:center;gap:5px;font-size:13px;vertical-align:2px;font-weight:600;color:#4338CA;background:#EEF2FF;border:1px solid #C7D2FE;border-radius:999px;padding:2px 9px;white-space:nowrap}
